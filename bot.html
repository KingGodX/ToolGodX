<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="ToolGodX - Premium ID/Cookie Splitter Tool for Bots. Fast, secure, and easy to use.">
    <meta name="keywords" content="ID Splitter, Cookie Splitter, Bot Tool, ToolGodX, Text Splitter">
    <meta name="theme-color" content="#3b82f6">
    <meta property="og:title" content="ToolGodX - ID Splitter Pro">
    <meta property="og:description" content="The ultimate tool for splitting accounts and cookies for multiple bots.">
    <meta property="og:type" content="website">
    <title>ToolGodX - ID Splitter</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>
    <div class="background-glob"></div>

    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" class="nav-logo">
                ToolGod<span class="accent">X</span>
            </a>
            <ul class="nav-menu">
                <li><a href="bot.html" class="nav-link active">BOT SPLITTER</a></li>
                <li><a href="storm.html" class="nav-link">STORM SPLITTER</a></li>
                <li><a href="create_sheet.html" class="nav-link">CREATE SHEET</a></li>
                <li><a href="pcboost.html" class="nav-link">PC BOOST</a></li>
            </ul>
            <a href="#" class="nav-link contact-btn">Contact</a>
        </div>
    </nav>

    <div class="container">
        <header>
            <h1 class="glow-text">BOT SPLITTER <span class="accent">PRO</span></h1>
            <p class="subtitle">เครื่องมือแบ่งไอดีสำหรับสายบอท แยกง่าย รวดเร็ว แม่นยำ</p>
        </header>

        <main>
            <div class="card input-card">
                <div class="form-group">
                    <label for="inputText">Enter Account / Cookie</label>
                    <textarea id="inputText"
                        placeholder="Combo:Username:Password:Cookie&#10;Username:Password"></textarea>
                    <div class="meta-info" id="lineCount">จำนวนทั้งหมด: 0 รายการ</div>
                </div>

                <div class="controls">
                    <div class="control-group">
                        <label for="splitCount">Amount PC / Bot</label>
                        <div class="number-input">
                            <button id="decBtn">−</button>
                            <input type="number" id="splitCount" value="2" min="1" max="100">
                            <button id="incBtn">+</button>
                        </div>
                    </div>

                    <div class="control-group">
                        <label for="outputMode">Output Mode</label>
                        <select id="outputMode" class="styled-select">
                            <option value="cards">Standard</option>
                            <option value="single">Visual Code</option>
                        </select>
                    </div>

                    <button id="splitBtn" class="action-btn btn-animate-blue">
                        <span class="btn-text">🚀 แยกข้อมูลทันที</span>
                    </button>
                    <button id="clearBtn" class="secondary-btn">🗑️ ล้างข้อมูล</button>
                </div>
            </div>

            <div id="resultsArea" class="results-grid">
                <!-- Results will be generated here -->
            </div>
        </main>

        <footer>
            <p>Created by ToolGodX Agent &bull; 2026</p>
        </footer>
    </div>
</body>

</html>
