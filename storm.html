<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="ToolGodX - Storm Splitter. Automatically extract combinations from Storm Bot CSV exports and split for multiple sessions.">
    <meta name="keywords" content="Storm Splitter, Storm Bot, CSV Parser, Combo Extractor, ToolGodX">
    <meta name="theme-color" content="#ec4899">
    <meta property="og:title" content="ToolGodX - Storm Splitter">
    <meta property="og:description" content="Extract and split combos from Storm Bot CSV exports instantly.">
    <meta property="og:type" content="website">
    <title>ToolGodX - Storm Splitter</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="storm_script.js" defer></script>
</head>

<body>
    <div class="background-glob"
        style="background: radial-gradient(circle, rgba(236, 72, 153, 0.5) 0%, transparent 70%);"></div>

    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" class="nav-logo">
                ToolGod<span class="accent">X</span>
            </a>
            <ul class="nav-menu">
                <li><a href="bot.html" class="nav-link">BOT SPLITTER</a></li>
                <li><a href="storm.html" class="nav-link active">STORM SPLITTER</a></li>
                <li><a href="create_sheet.html" class="nav-link">CREATE SHEET</a></li>
            </ul>
            <a href="#" class="nav-link contact-btn">Contact</a>
        </div>
    </nav>

    <div class="container">
        <header>
            <h1 class="glow-text" style="text-shadow: 0 0 20px rgba(236, 72, 153, 0.5);">STORM <span
                    class="accent">SPLITTER</span></h1>
            <p class="subtitle">เครื่องมือดึง Combo จากไฟล์ Storm Export และแบ่งให้อัตโนมัติ</p>
        </header>

        <main>
            <div class="card input-card">
                <div class="form-group">
                    <div
                        style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem;">
                        <label for="inputText" style="margin-bottom: 0;">Paste Storm CSV or Drag & Drop File</label>
                        <div class="meta-info" id="lineCount" style="margin-top: 0;">จำนวนที่พบ: 0 รายการ</div>
                    </div>
                    <div id="dropZone" class="drop-zone">
                        <textarea id="inputText"
                            placeholder='Drag and drop your Storm Export .csv file here...&#10;Or paste content: "GodX1","User:Pass",...'></textarea>
                        <div class="drop-overlay">📂 วางไฟล์ที่นี่</div>
                    </div>
                </div>

                <div class="controls">


                    <div class="control-group">
                        <label for="outputMode">Output Mode</label>
                        <select id="outputMode" class="styled-select">
                            <option value="cards">Standard</option>
                            <option value="single">Visual Code</option>
                        </select>
                    </div>

                    <button id="splitBtn" class="action-btn btn-animate-pink">
                        <span class="btn-text">🌪️ แยกข้อมูล Storm</span>
                    </button>
                    <button id="clearBtn" class="secondary-btn">🗑️ ล้างข้อมูล</button>
                </div>
            </div>

            <div id="resultsArea" class="results-grid">
                <!-- Results will be generated here -->
            </div>
        </main>

        <footer>
            <p>Created by ToolGodX Agent &bull; 2026</p>
        </footer>
    </div>
</body>

</html>
